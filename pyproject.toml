[project]
name = "loas"
version = "0.1.15"
description = "Helper file for loas.dev"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "mitreattack-python>=6.2.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "typer>=0.27.1",
  "requests>=2.34.2",
  "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
  "bump-my-version>=1.5.1",
  "pre-commit>=4.6.2",
  "ruff>=0.16.4",
]

[tool.bumpversion]
current_version = "0.1.15"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "docs/package.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

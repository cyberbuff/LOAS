name: Application Window Discovery
tests:
  - name: Find all running applications which currently have a window
    guid: 019a8de9-49b4-7094-989f-ab2abbed5c36
    description: This test uses System Events to find all running applications that currently have a window.
    language: AppleScript
    tcc_required: true
    command: |-
      tell application "System Events" to get name of every process whose background only is false

  - name: Get the frontmost application (using AppKit)
    guid: 01a0c107-c320-777a-812d-fb213477a0e3
    language: AppleScript
    references:
      - https://www.sentinelone.com/blog/macos-red-team-calling-apple-apis-without-building-binaries/
    description: Returns the name of the currently active (frontmost) application by calling NSWorkspace via AppleScript-ObjC. Malware watches for a spoofed target application becoming frontmost before socially engineering the user.
    command: |
      use framework "Foundation"
      use framework "AppKit"

      set frontApp to current application's NSWorkspace's sharedWorkspace's frontmostApplication()
      set frontAppName to frontApp's localizedName() as text
      return frontAppName

  - name: Get the frontmost application (using System Events)
    guid: 01a0c107-c320-777a-812d-fb2249e326c9
    language: AppleScript
    references:
      - https://www.sentinelone.com/blog/macos-red-team-calling-apple-apis-without-building-binaries/
    description: Returns the name of the frontmost application using vanilla System Events, an alternative to the AppKit approach that does not reach into Cocoa frameworks.
    tcc_required: true
    command: |-
      tell application "System Events" to get name of first process whose frontmost is true

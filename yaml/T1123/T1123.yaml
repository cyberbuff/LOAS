name: Audio Capture
tests:
  - name: Capture Audio
    guid: 019a8de9-49b3-72d5-a43a-7dc2abc60d67
    description: Capture audio using QuickTime Player
    language: AppleScript
    tcc_required: true
    command: |-
      tell application "QuickTime Player"
       	activate
       	new audio recording
       	delay 2
       	tell front document
      		start
      		delay "#{recordingTime}"
      		stop
       	end tell
       	export front document in (POSIX file "#{filePath}") using settings preset "Audio Only"
       	quit saving no
      end tell
    args:
      recordingTime: 3
      filePath: "/tmp/recording.m4a"

  - name: Get microphone input volume
    guid: 01a035fa-adc0-775f-b781-8558324908be
    description: Gets the current microphone input volume through AppleScript, as seen in OSX.Leverage.
    references:
      - https://papers.vx-underground.org/papers/Malware%20Defense/Malware%20Analysis%202013/2013-09-24%20-%20OSX-Leverage.a%20Analysis.pdf
    language: AppleScript
    command: |-
      input volume of (get volume settings)

  - name: Mute microphone input volume
    guid: 01a035fa-adc0-775f-b781-85597928ccf8
    description: Sets the microphone input volume to zero through AppleScript, as seen in OSX.Leverage.
    references:
      - https://papers.vx-underground.org/papers/Malware%20Defense/Malware%20Analysis%202013/2013-09-24%20-%20OSX-Leverage.a%20Analysis.pdf
    language: AppleScript
    command: |-
      set volume input volume 0
